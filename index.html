<!DOCTYPE html>
<html>
<head>
  <title>Study Buddy</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
    }

    .box {
      width: 400px;
      margin: 60px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      width: 70%;
      padding: 10px;
    }

    button {
      padding: 10px;
    }

    #ans {
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>📚 Study Buddy</h2>

  <input id="q" placeholder="Ask something..." />
  <button onclick="ask()">Ask</button>

  <div id="ans"></div>
</div>

<script>
async function ask() {
  let q = document.getElementById("q").value;

  document.getElementById("ans").innerText = "Thinking...";

  try {
    let res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question: q })
    });

    let data = await res.json();

    document.getElementById("ans").innerText = data.answer;
  } catch {
    document.getElementById("ans").innerText = "Error. Try again.";
  }
}
</script>

</body>
</html>
